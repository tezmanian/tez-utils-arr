services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ../tez-utils-enum:/packages/tez-utils-enum
      - composer-cache:/tmp/composer
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer

volumes:
  composer-cache:
